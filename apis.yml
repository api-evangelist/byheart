aid: byheart
name: ByHeart
description: >-
  ByHeart is a US infant-nutrition company founded in 2016 that makes Whole
  Nutrition Infant Formula, marketed on the promise of better science, better
  ingredients, and better quality. It sells direct-to-consumer through a Shopify
  storefront at byheart.com as well as through retail. The company ran its own
  clinical program and built its own manufacturing. In November 2025 ByHeart
  recalled all batches after Clostridium botulinum contamination linked to
  infant-botulism cases and paused production pending FDA clearance to resume.
  ByHeart is a portfolio company of D1 Capital. It publishes no first-party
  developer API; its only machine-discoverable surface is the Shopify Customer
  Account API (OpenID Connect / OAuth 2.0) advertised under its domain.
